[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plutosai-simulation-service"
version = "1.0.0"
description = "MiroFish-inspired financial prediction simulation engine for OpenClaw / Project Francesca"
authors = [{ name = "PlutosAI" }]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "openai>=1.0",
    "redis[asyncio]>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "prometheus-fastapi-instrumentator>=5.9",
    "../../shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",           # AsyncTestClient
    "ruff>=0.1",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "N", "B", "C4", "PIE", "RET", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = ["--strict-markers", "--tb=short"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
