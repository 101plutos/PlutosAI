[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plutosai-blockchain-service"
version = "0.1.0"
description = "Blockchain service for digital asset management"
authors = [{ name = "PlutosAI" }]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Web framework
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",

    # Database
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",

    # Caching
    "redis>=5.0",

    # Blockchain interactions
    "web3>=6.15",  # Ethereum interaction
    "eth-account>=0.11",  # Ethereum account management
    "bitcoinlib>=0.12",  # Bitcoin interaction

    # DeFi protocols
    "aave-api>=0.1",  # Aave protocol (if available)
    "uniswap-python>=0.7",  # Uniswap interaction

    # Cross-chain
    "layerzero-api>=0.1",  # LayerZero for cross-chain (if available)

    # Price data
    "pycoingecko>=3.1",

    # Authentication
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",

    # Validation and utilities
    "pydantic>=2.4",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "nats-py>=2.8.0",
    "prometheus-fastapi-instrumentator>=5.9",

    # Shared domain
    "../../shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.1",
    "mypy>=1.8",
    "black>=23.0",
    "isort>=5.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "N", "B", "C4", "PIE", "RET", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = ["--strict-markers", "--tb=short", "--cov=src", "--cov-report=term-missing"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
