[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plutosai-client-service"
version = "0.1.0"
description = "Client management service for PlutosAI family office"
authors = [{ name = "PlutosAI" }]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Web framework
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",

    # Database
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",

    # Authentication
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",

    # Validation
    "pydantic>=2.4",
    "pydantic-settings>=2.4",

    # Utilities
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0",
    "nats-py>=2.8.0",
    "prometheus-fastapi-instrumentator>=5.9",

    # Shared domain
    "../shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.1",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "N", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
